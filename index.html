<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#101820" />
<title>TESTE WELTIN - PROJETAR</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
  #app{position:fixed;inset:0;background:#101820;display:flex;align-items:center;justify-content:center}
  #start{border:0;border-radius:16px;padding:22px 26px;background:#16a34a;color:#fff;font-size:clamp(19px,4vw,25px);font-weight:800;letter-spacing:.02em;box-shadow:0 12px 36px #0007;max-width:90vw}
  #stage{display:none;position:fixed;inset:0;background:#000}
  #camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #render{position:absolute;inset:0;width:100%;height:100%;pointer-events:auto}
  #render canvas{display:block;width:100%;height:100%}
  #status{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 12px);padding:11px 14px;border-radius:12px;background:#101820d9;color:#fff;font-size:14px;line-height:1.35;backdrop-filter:blur(8px)}
  #tools{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .tool{border:1px solid #ffffff55;border-radius:12px;padding:12px 15px;background:#101820e8;color:white;font-weight:650;font-size:14px}
  #file{display:none}
  #hint{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 78px);text-align:center;color:#fff;background:#101820b8;border-radius:10px;padding:10px;font-size:12px;line-height:1.35}
</style>
</head>
<body>
<div id="app"><button id="start">TESTE WELTIN - PROJETAR</button></div>
<div id="stage">
  <video id="camera" autoplay playsinline muted></video>
  <div id="render"></div>
  <div id="status">Iniciando câmera…</div>
  <div id="hint">Protótipo inicial: a imagem do modelo é sobreposta à câmera. O iPad Safari não oferece rastreamento WebXR de piso; portanto, ainda não é uma ancoragem espacial real.</div>
  <div id="tools">
    <button class="tool" id="load">Carregar arquivo PLY</button>
    <button class="tool" id="zoomIn">Aumentar</button>
    <button class="tool" id="zoomOut">Diminuir</button>
    <button class="tool" id="close">Fechar</button>
  </div>
</div>
<input id="file" type="file" accept=".ply,application/octet-stream" />
<script type="module">
const startBtn=document.querySelector('#start'), app=document.querySelector('#app'), stage=document.querySelector('#stage');
const video=document.querySelector('#camera'), renderRoot=document.querySelector('#render'), status=document.querySelector('#status');
const fileInput=document.querySelector('#file'); let stream=null, viewer=null, objectUrl=null, scale=1;
function setStatus(t){status.textContent=t}
async function start(){
  app.style.display='none'; stage.style.display='block';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    video.srcObject=stream; await video.play();
    setStatus('Câmera ativa. Toque em “Carregar arquivo PLY” e selecione LTM1250 - 250 10-11-26.ply.');
  }catch(e){setStatus('Não foi possível abrir a câmera. Verifique a permissão do Safari e se a página está em HTTPS. Erro: '+e.message)}
}
startBtn.addEventListener('click',start);
document.querySelector('#load').addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',async()=>{
  const file=fileInput.files?.[0]; if(!file)return;
  if(!file.name.toLowerCase().endsWith('.ply')){setStatus('Selecione um arquivo .PLY.');return;}
  if(objectUrl)URL.revokeObjectURL(objectUrl); objectUrl=URL.createObjectURL(file);
  setStatus(`Arquivo recebido (${(file.size/1024/1024).toFixed(1)} MB). Carregando 3DGS…`);
  try{
    const THREE=await import('https://esm.sh/three@0.180.0');
    const GS=await import('https://esm.sh/@mkkellogg/gaussian-splats-3d?external=three');
    if(viewer){try{viewer.dispose?.()}catch{} renderRoot.innerHTML='';}
    const renderer=new THREE.WebGLRenderer({alpha:true,antialias:false,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5)); renderer.setSize(renderRoot.clientWidth,renderRoot.clientHeight); renderer.setClearColor(0x000000,0);
    renderer.domElement.style.background='transparent'; renderRoot.appendChild(renderer.domElement);
    const camera=new THREE.PerspectiveCamera(60,renderRoot.clientWidth/renderRoot.clientHeight,0.01,1000);
    camera.position.set(0,-3,2); camera.up.set(0,0,1); camera.lookAt(0,0,0);
    viewer=new GS.Viewer({rootElement:renderRoot,renderer,camera,useBuiltInControls:true,ignoreDevicePixelRatio:true,gpuAcceleratedSort:false,enableSIMDInSort:true,integerBasedSort:false,halfPrecisionCovariancesOnGPU:true,sphericalHarmonicsDegree:0,webXRMode:GS.WebXRMode.None,logLevel:GS.LogLevel.Warn});
    await viewer.addSplatScene(objectUrl,{format:GS.SceneFormat.Ply,showLoadingUI:false,progressiveLoad:true,scale:[scale,scale,scale]});
    viewer.start(); setStatus('Modelo carregado. Arraste na tela para ajustar a visualização. Protótipo de sobreposição — sem ancoragem automática no piso.');
  }catch(e){console.error(e);setStatus('Falha ao carregar o PLY neste navegador/dispositivo: '+(e?.message||e)+'. O arquivo tem 184 MB; pode exigir conversão/otimização para iPad.');}
});
document.querySelector('#zoomIn').addEventListener('click',()=>{scale=Math.min(scale*1.15,5);setStatus('Escala de ajuste: '+scale.toFixed(2)+'x. Para aplicar a nova escala, recarregue o PLY.');});
document.querySelector('#zoomOut').addEventListener('click',()=>{scale=Math.max(scale/1.15,.1);setStatus('Escala de ajuste: '+scale.toFixed(2)+'x. Para aplicar a nova escala, recarregue o PLY.');});
document.querySelector('#close').addEventListener('click',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());if(objectUrl)URL.revokeObjectURL(objectUrl);stage.style.display='none';app.style.display='flex';});
window.addEventListener('resize',()=>{if(viewer){const c=renderRoot.querySelector('canvas'); if(c){c.style.width='100%';c.style.height='100%';}}});
</script>
</body>
</html>
